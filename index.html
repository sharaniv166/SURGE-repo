/* ================================================================
   AMBIENT BACKGROUND (post-entry, persistent across every screen)
   A slow, low-opacity "live operations" visualization behind the
   UI: faint regional hubs (echoing ZONES / the intro's map
   language), merchant nodes, field-agent nodes drifting between
   zones, flowing agent→merchant route lines, data particles
   travelling those routes, and occasional verification pulses.
   Reads state.route each frame (cheap) so it can lean into the
   theme of whichever screen is open without re-initializing.
   Never intercepts input (pointer-events:none) and never paints
   over UI — every real surface (sidebar/topbar/cards) has its own
   opaque background; only the empty page gutters reveal this.
   ================================================================ */
function initAmbientBackground(){
  const canvas = document.getElementById('app-ambient');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W,H,DPR;
  function resize(){
    DPR = Math.min(1.5, window.devicePixelRatio||1);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  // Regional hubs — reuses the same ZONES cx/cy the intro and Live
  // Map use, so the ambient layer reads as the same operational
  // geography, not a decorative unrelated background.
  const hubs = ZONES.map(z => ({x:z.cx, y:z.cy}));

  // Merchant nodes: many, small, mostly dim — clustered loosely
  // around a zone hub (never a literal map, just "regions of work").
  const N_M = 46;
  const merchants = Array.from({length:N_M}, (_,i) => {
    const hub = hubs[i % hubs.length];
    const critical = i % 9 === 0; // a stable minority read as higher-priority
    return {
      hub, critical,
      x: clamp(hub.x + (Math.random()-0.5)*0.16, 0.02, 0.98),
      y: clamp(hub.y + (Math.random()-0.5)*0.16, 0.05, 0.95),
      vx:(Math.random()-0.5)*0.00006, vy:(Math.random()-0.5)*0.00006,
      pulseAt: -1,
    };
  });

  // Agent nodes: 12, one drifting "assignment" target merchant each,
  // slowly travelling toward it and re-targeting on arrival — this
  // is what reads as "field agents moving between locations".
  const agents = Array.from({length:12}, (_,i) => {
    const hub = hubs[i % hubs.length];
    const a = { x: hub.x, y: hub.y, hubIdx: i % hubs.length, targetIdx: null, t: 0, speed: 0.0011 + Math.random()*0.0006 };
    return a;
  });
  function poolFor(agent){ return merchants.filter(m => m.hub === hubs[agent.hubIdx]); }
  function retarget(agent){
    const pool = poolFor(agent);
    const m = pool.length ? pool[Math.floor(Math.random()*pool.length)] : merchants[Math.floor(Math.random()*merchants.length)];
    agent.targetIdx = merchants.indexOf(m);
    agent.fromX = agent.x; agent.fromY = agent.y;
    agent.t = 0;
  }
  agents.forEach(retarget);

  let lastPulse = 0, dashPhase = 0;

  function screenMode(){
    const r = state.route;
    if(r==='priority-queue') return 'priority';
    if(r==='field-operations') return 'field';
    if(r==='operational-map') return 'map';
    if(r==='document-copilot') return 'docs';
    if(r==='simulator') return 'simulator';
    return 'default';
  }

  function draw(now){
    ctx.clearRect(0,0,W,H);
    const css = getComputedStyle(document.documentElement);
    const dataColor = css.getPropertyValue('--data').trim() || '#0f8a83';
    const accentColor = css.getPropertyValue('--accent').trim() || '#c5601f';
    const criticalColor = css.getPropertyValue('--critical').trim() || '#b3261e';
    const mode = screenMode();
    const routeStrength = mode==='map' ? 1.55 : mode==='field' ? 1.2 : 1;
    const pulseInterval = mode==='docs' ? 1400 : mode==='priority' ? 1700 : 2600;
    // What-If: agent throughput visually tracks the capacity slider
    const agentRatio = (state.route==='simulator' && state.simParams) ? clamp(state.simParams.agentCount/12, 0.3, 1.4) : 1;

    // 1) faint regional hubs — the "map-grid" layer
    hubs.forEach(h=>{
      ctx.beginPath(); ctx.arc(h.x*W, h.y*H, 34, 0, Math.PI*2);
      ctx.strokeStyle = dataColor; ctx.globalAlpha = 0.26; ctx.lineWidth = 1;
      ctx.stroke();
    });

    // 2) merchant nodes drift very slightly within their hub
    merchants.forEach(m=>{
      m.x += m.vx; m.y += m.vy;
      if(Math.abs(m.x-m.hub.x) > 0.1) m.vx *= -1;
      if(Math.abs(m.y-m.hub.y) > 0.1) m.vy *= -1;
    });

    // 3) agents travel slowly toward their current target merchant
    agents.forEach(a=>{
      const target = merchants[a.targetIdx];
      if(!target){ return; }
      a.t = clamp(a.t + a.speed*agentRatio*(mode==='field'?1.4:1), 0, 1);
      const e = easeInOut(a.t);
      a.x = lerp(a.fromX, target.x, e);
      a.y = lerp(a.fromY, target.y, e);
      if(a.t>=1) retarget(a);
    });

    // 4) flowing route lines: each agent to its target, animated dash
    dashPhase = (dashPhase + 0.35) % 16;
    agents.forEach(a=>{
      const target = merchants[a.targetIdx];
      if(!target) return;
      ctx.beginPath(); ctx.moveTo(a.x*W, a.y*H); ctx.lineTo(target.x*W, target.y*H);
      ctx.strokeStyle = accentColor; ctx.globalAlpha = 0.34*routeStrength; ctx.lineWidth = 1.1;
      ctx.setLineDash([3,5]); ctx.lineDashOffset = -dashPhase;
      ctx.stroke(); ctx.setLineDash([]);
    });

    // 5) data particles travelling the same routes
    agents.forEach((a,i)=>{
      const target = merchants[a.targetIdx];
      if(!target) return;
      const pt = (a.t*3 + i*0.37) % 1;
      const px = lerp(a.x, target.x, pt), py = lerp(a.y, target.y, pt);
      ctx.beginPath(); ctx.arc(px*W, py*H, 1.6, 0, Math.PI*2);
      ctx.fillStyle = dataColor; ctx.globalAlpha = 0.7*routeStrength; ctx.fill();
    });
    ctx.globalAlpha = 1;

    // 6) merchant dots (critical ones tinted, brighter under AI Priority)
    merchants.forEach(m=>{
      const isCriticalTint = m.critical && (mode==='priority' || mode==='default');
      ctx.beginPath(); ctx.arc(m.x*W, m.y*H, isCriticalTint?2.2:1.6, 0, Math.PI*2);
      ctx.fillStyle = isCriticalTint ? criticalColor : dataColor;
      ctx.globalAlpha = isCriticalTint ? 0.65 : 0.42;
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // 7) agent dots
    agents.forEach(a=>{
      ctx.beginPath(); ctx.arc(a.x*W, a.y*H, mode==='field'?3.4:2.7, 0, Math.PI*2);
      ctx.fillStyle = accentColor; ctx.globalAlpha = 0.75; ctx.fill();
      ctx.globalAlpha = 1;
    });

    // 8) occasional verification pulses — a merchant briefly rings out.
    // Document Copilot reads these as a small verification glyph
    // instead of a plain ring, to lean into "checking a document".
    if(now - lastPulse > pulseInterval){
      lastPulse = now;
      const m = merchants[Math.floor(Math.random()*merchants.length)];
      m.pulseAt = now;
    }
    merchants.forEach(m=>{
      if(m.pulseAt<0) return;
      const t = (now - m.pulseAt) / 1100;
      if(t>1){ m.pulseAt = -1; return; }
      const alpha = (1-t)*0.65;
      if(mode==='docs'){
        const s = 5 + t*7;
        ctx.strokeStyle = dataColor; ctx.globalAlpha = alpha; ctx.lineWidth = 1.2;
        ctx.strokeRect(m.x*W - s/2, m.y*H - s/2, s, s*1.3);
      } else {
        ctx.beginPath(); ctx.arc(m.x*W, m.y*H, 3 + t*16, 0, Math.PI*2);
        ctx.strokeStyle = m.critical ? criticalColor : dataColor;
        ctx.globalAlpha = alpha; ctx.lineWidth = 1.2;
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    });
  }

  if(prefersReducedMotion()){ draw(0); return; }
  function loop(now){ draw(now); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
}

/* ================================================================
   INTRO — cinematic scene-state-machine sequence
   Canvas draws particle/network visuals only; all typographic
   content (captions, countdown, logo, tagline) is real DOM text
   overlaid on top, per the "canvas text is blurry" rule.
   ================================================================ */
function lerp(a,b,t){ return a+(b-a)*t; }
function easeInOut(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }

function buildIntroParticles(){
  const N_M = 140, cols=20, rows=7;
  const merchants = Array.from({length:N_M}, (_,i) => {
    const zoneIdx = i % ZONES.length;
    const priority = Math.random();
    return { zoneIdx, priority, critical: priority>0.78,
      scatter:{x:Math.random(), y:Math.random()},
      pile:{x:0.5+(Math.random()-0.5)*0.12, y:0.5+(Math.random()-0.5)*0.12},
    };
  });
  // dense grid ("sparse" scene — many merchants vs few agents)
  merchants.forEach((p,i)=>{
    const col = i%cols, row = Math.floor(i/cols);
    p.sparse = {x: 0.06+col*(0.88/(cols-1)), y: 0.32+row*(0.6/(rows-1))};
  });
  // zone hub clusters, echoing the real Live Map layout
  merchants.forEach(p=>{
    const z = ZONES[p.zoneIdx];
    p.zone = {x: clamp(z.cx+(Math.random()-0.5)*0.14,0.03,0.97), y: clamp(z.cy+(Math.random()-0.5)*0.14,0.08,0.94)};
  });
  // reorganized: grid ordered by priority desc (top-left = highest)
  const byPriority = merchants.slice().sort((a,b)=>b.priority-a.priority);
  byPriority.forEach((p,i)=>{
    const col = i%cols, row = Math.floor(i/cols);
    p.sorted = {x:0.06+col*(0.88/(cols-1)), y:0.32+row*(0.6/(rows-1))};
  });

  const agents = Array.from({length:12}, (_,i) => {
    const zoneIdx = i % ZONES.length;
    const z = ZONES[zoneIdx];
    return {
      zoneIdx,
      sparse:{x:0.08+i*(0.84/11), y:0.15},
      zone:{x:clamp(z.cx+(Math.random()-0.5)*0.05,0.05,0.95), y:clamp(z.cy-0.02,0.05,0.95)},
      sorted:{x:0.08+i*(0.84/11), y:0.90},
    };
  });
  return {merchants, agents};
}

function initIntro(){
  const canvas = document.getElementById('intro-canvas');
  const ctx = canvas.getContext('2d');
  let W,H,DPR;
  function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; canvas.width=W*DPR; canvas.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
  resize(); window.addEventListener('resize', resize);

  const {merchants: introMerchants, agents: introAgents} = buildIntroParticles();

  const SCENES = [
    {caption:'500 merchants require re-verification.', dur:1100, posFrom:null, posTo:'scatter'},
    {caption:'Just 12 field agents to cover all of them.', dur:1200, posFrom:'scatter', posTo:'sparse'},
    {caption:null, big:true, dur:1300, posFrom:'sparse', posTo:'sparse'},
    {caption:'Every case adds to the verification backlog.', dur:1100, posFrom:'sparse', posTo:'pile'},
    {caption:'Merchants and agents, mapped by zone.', dur:1300, posFrom:'pile', posTo:'zone'},
    {caption:'SURGE analyzes the backlog in real time.', dur:1400, posFrom:'zone', posTo:'zone', scan:true},
    {caption:'AI prioritizes merchants by risk and impact.', dur:1300, posFrom:'zone', posTo:'sorted'},
    {caption:'Workforce and routes optimize into a live plan.', dur:1300, posFrom:'sorted', posTo:'sorted', routes:true},
    {caption:null, logo:true, dur:1100, posFrom:'sorted', posTo:'sorted', fadeParticles:true},
    {caption:null, desc:true, dur:1300, posFrom:'sorted', posTo:'sorted', fadeParticles:true},
    {caption:null, tagline:true, dur:1600, posFrom:'sorted', posTo:'sorted', fadeParticles:true},
  ];
  let cum=0; SCENES.forEach(s=>{ s.start=cum; cum+=s.dur; });
  const TOTAL = cum;

  const captionEl = document.getElementById('intro-caption');
  const bigEl = document.getElementById('intro-big');
  const logoEl = document.getElementById('intro-logo');
  const descEl = document.getElementById('intro-desc');
  const taglineEl = document.getElementById('intro-tagline');
  const enterBtn = document.getElementById('intro-enter');
  const progressEl = document.getElementById('intro-progress');
  progressEl.innerHTML = SCENES.map(()=>'<i></i>').join('');
  const dotEls = [...progressEl.children];
  const DESC_TEXT = 'AI-powered operational planning for completing large-scale merchant verification before regulatory deadlines.';
  const TAGLINE_TEXT = 'Turn regulatory deadlines into executable operations.';

  function resetOverlays(){
    captionEl.classList.remove('show');
    bigEl.classList.remove('show'); bigEl.hidden = true;
    logoEl.classList.remove('show'); logoEl.hidden = true;
    descEl.classList.remove('show'); descEl.hidden = true;
    taglineEl.classList.remove('show'); taglineEl.hidden = true;
  }
  function applyScene(sc){
    resetOverlays();
    if(sc.caption){ captionEl.textContent = sc.caption; requestAnimationFrame(()=>captionEl.classList.add('show')); }
    if(sc.big){ bigEl.hidden = false; bigEl.innerHTML = `${state.daysRemaining}<small>DAYS TO DEADLINE</small>`; requestAnimationFrame(()=>bigEl.classList.add('show')); }
    if(sc.logo){ logoEl.hidden = false; requestAnimationFrame(()=>logoEl.classList.add('show')); }
    if(sc.desc){
      logoEl.hidden = false; logoEl.classList.add('show');
      descEl.hidden = false; descEl.textContent = DESC_TEXT;
      requestAnimationFrame(()=>descEl.classList.add('show'));
    }
    if(sc.tagline){
      logoEl.hidden = false; logoEl.classList.add('show');
      descEl.hidden = false; descEl.textContent = DESC_TEXT; descEl.classList.add('show');
      taglineEl.hidden = false; taglineEl.textContent = TAGLINE_TEXT;
      requestAnimationFrame(()=>taglineEl.classList.add('show'));
      enterBtn.classList.add('show');
    }
  }

  function drawFrame(sceneIdx, sc, progress){
    ctx.clearRect(0,0,W,H);
    const eased = easeInOut(progress);
    introMerchants.forEach((p,i)=>{
      let x,y,op;
      if(sc.posFrom===null){
        x=p.scatter.x; y=p.scatter.y;
        op = clamp(progress*1.4 - (i/introMerchants.length)*0.9, 0, 1);
      } else {
        const from=p[sc.posFrom], to=p[sc.posTo];
        x=lerp(from.x,to.x,eased); y=lerp(from.y,to.y,eased);
        op = sceneIdx===2 ? 0.2 : 0.85;
      }
      if(sc.fadeParticles) op *= (1-progress);
      if(op<=0.02) return;
      const px=x*W, py=y*H;
      if(p.critical){ ctx.shadowBlur=7; ctx.shadowColor=`rgba(239,83,80,${op*0.8})`; }
      ctx.beginPath(); ctx.arc(px,py, p.critical?2.6:1.7, 0, Math.PI*2);
      ctx.fillStyle = p.critical ? `rgba(239,83,80,${op})` : `rgba(200,210,218,${op*0.7})`;
      ctx.fill();
      ctx.shadowBlur=0;
    });
    introAgents.forEach((a) => {
      if(sceneIdx<1) return;
      const fromKey = ['scatter','pile',null].includes(sc.posFrom) ? 'sparse' : sc.posFrom;
      const toKey = ['scatter','pile',null].includes(sc.posTo) ? 'sparse' : sc.posTo;
      const from=a[fromKey]||a.sparse, to=a[toKey]||a.sparse;
      const x=lerp(from.x,to.x,eased), y=lerp(from.y,to.y,eased);
      let op = sceneIdx===1 ? progress : 1;
      if(sc.fadeParticles) op *= (1-progress);
      if(op<=0.02) return;
      const px=x*W, py=y*H;
      ctx.shadowBlur=9; ctx.shadowColor=`rgba(232,134,46,${op*0.55})`;
      ctx.beginPath(); ctx.arc(px,py,4.2,0,Math.PI*2); ctx.fillStyle=`rgba(232,134,46,${op})`; ctx.fill();
      ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(px,py,7.5,0,Math.PI*2); ctx.strokeStyle=`rgba(232,134,46,${op*0.35})`; ctx.lineWidth=1.5; ctx.stroke();
    });
    if(sceneIdx>=4 && sceneIdx<=7){
      const hubOp = sc.fadeParticles ? 0 : 0.45;
      ZONES.forEach(z=>{
        const px=z.cx*W, py=z.cy*H;
        ctx.beginPath(); ctx.arc(px,py,18,0,Math.PI*2);
        ctx.strokeStyle=`rgba(63,208,201,${hubOp})`; ctx.lineWidth=1.5; ctx.stroke();
      });
    }
    if(sc.scan){
      const sx = progress*W;
      const grad = ctx.createLinearGradient(sx-70,0,sx+70,0);
      grad.addColorStop(0,'rgba(63,208,201,0)'); grad.addColorStop(0.5,'rgba(63,208,201,0.16)'); grad.addColorStop(1,'rgba(63,208,201,0)');
      ctx.fillStyle=grad; ctx.fillRect(sx-70,0,140,H);
    }
    if(sc.routes){
      const op = clamp(progress*1.6,0,1)*0.55;
      introAgents.forEach(a=>{
        const targets = introMerchants.filter(m=>m.zoneIdx===a.zoneIdx).sort((m1,m2)=>m2.priority-m1.priority).slice(0,2);
        const ax=a.sorted.x*W, ay=a.sorted.y*H;
        targets.forEach(m=>{
          const mx=m.sorted.x*W, my=m.sorted.y*H;
          ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(mx,my);
          ctx.strokeStyle=`rgba(232,134,46,${op})`; ctx.lineWidth=1; ctx.stroke();
        });
      });
    }
  }

  let rafId=null, startTime=null, lastSceneIdx=-1;
  function frame(now){
    if(startTime===null) startTime=now;
    const elapsed = now-startTime;
    if(elapsed>=TOTAL){ drawFrame(SCENES.length-1, SCENES[SCENES.length-1], 1); return; }
    let idx = SCENES.findIndex(s=>elapsed < s.start+s.dur);
    if(idx===-1) idx = SCENES.length-1;
    const sc = SCENES[idx];
    const progress = clamp((elapsed-sc.start)/sc.dur, 0, 1);
    if(idx!==lastSceneIdx){
      lastSceneIdx = idx;
      applyScene(sc);
      dotEls.forEach((d,i)=>{ d.classList.toggle('done', i<idx); d.classList.toggle('active', i===idx); });
    }
    drawFrame(idx, sc, progress);
    rafId = requestAnimationFrame(frame);
  }

  function skipIntro(){
    if(rafId) cancelAnimationFrame(rafId);
    document.getElementById('intro').style.display = 'none';
    enterApp();
  }
  function clickEnter(){
    if(rafId) cancelAnimationFrame(rafId);
    const intro = document.getElementById('intro');
    intro.classList.add('exiting');
    setTimeout(()=>{ intro.style.display='none'; }, prefersReducedMotion()?0:280);
    enterApp();
  }
  document.getElementById('intro-skip').addEventListener('click', skipIntro);
  enterBtn.addEventListener('click', clickEnter);

  if(prefersReducedMotion()){
    dotEls.forEach(d=>d.classList.add('done'));
    logoEl.hidden=false; logoEl.classList.add('show');
    descEl.hidden=false; descEl.textContent=DESC_TEXT; descEl.classList.add('show');
    taglineEl.hidden=false; taglineEl.textContent=TAGLINE_TEXT; taglineEl.classList.add('show');
    enterBtn.classList.add('show');
  } else {
    rafId = requestAnimationFrame(frame);
  }
}

/* ================================================================
   INIT
   ================================================================ */
let ambientStarted = false;
function enterApp(){
  document.getElementById('app').classList.add('active');
  if(!ambientStarted){ ambientStarted = true; initAmbientBackground(); }
  if(!location.hash || location.hash==='#/') location.hash = '#/command-center';
  navigate((location.hash.replace('#/','')) || 'command-center');
}

window.addEventListener('hashchange', () => {
  const r = location.hash.replace('#/','');
  if(document.getElementById('app').classList.contains('active') && SCREEN_RENDERERS[r]) navigate(r);
});

document.addEventListener('DOMContentLoaded', () => {
  initIntro();
  renderNav();

  function openMobileNav(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-scrim').classList.add('open'); }
  function closeMobileNav(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-scrim').classList.remove('open'); }
  document.getElementById('nav-toggle').addEventListener('click', openMobileNav);
  document.getElementById('sidebar-scrim').addEventListener('click', closeMobileNav);
});
</script>
