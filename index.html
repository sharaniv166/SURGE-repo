<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   SURGE — design tokens
   UI type: Inter (readable enterprise sans). Display type (intro
   cinematic + logo mark only): Big Shoulders Display. Data/ID type:
   IBM Plex Mono.
   ============================================================ */
:root{
  --bg:#f3f4f6;
  --surface:#ffffff;
  --surface-2:#eceef1;
  --border:#d7dbe0;
  --text:#12161b;
  --text-dim:#5a6472;
  --text-faint:#8992a0;
  --accent:#c5601f;
  --accent-ink:#ffffff;
  --accent-soft:#f3e2d3;
  --data:#0f8a83;
  --data-soft:#d8f0ee;
  --good:#1c8a5a;
  --good-soft:#dbf3e6;
  --warn:#8a6a10;
  --warn-soft:#f7ecc9;
  --critical:#b3261e;
  --critical-soft:#f9dcda;
  --shadow: 0 1px 2px rgba(15,20,25,.06), 0 8px 24px -12px rgba(15,20,25,.15);
  --radius:10px;
  --font-display:'Big Shoulders Display',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --ambient-opacity:.24;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0c0f;
    --surface:#13171c;
    --surface-2:#1a1f26;
    --border:#262d36;
    --text:#eef2f5;
    --text-dim:#a2acb8;
    --text-faint:#69737f;
    --accent:#e8862e;
    --accent-ink:#1a0f04;
    --accent-soft:#3a2412;
    --data:#3fd0c9;
    --data-soft:#0e2b29;
    --good:#35d48a;
    --good-soft:#0f2b1f;
    --warn:#f0c239;
    --warn-soft:#2e2610;
    --critical:#ef5350;
    --critical-soft:#2e1414;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
    --ambient-opacity:.32;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0c0f;
  --surface:#13171c;
  --surface-2:#1a1f26;
  --border:#262d36;
  --text:#eef2f5;
  --text-dim:#a2acb8;
  --text-faint:#69737f;
  --accent:#e8862e;
  --accent-ink:#1a0f04;
  --accent-soft:#3a2412;
  --data:#3fd0c9;
  --data-soft:#0e2b29;
  --good:#35d48a;
  --good-soft:#0f2b1f;
  --warn:#f0c239;
  --warn-soft:#2e2610;
  --critical:#ef5350;
  --critical-soft:#2e1414;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
  --ambient-opacity:.32;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
html{overflow-x:hidden;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  overflow-x:hidden;
}
img{max-width:100%;}
[hidden]{display:none!important;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::selection{background:var(--accent);color:var(--accent-ink);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}

/* ============================================================
   INTRO — cinematic scene sequence
   ============================================================ */
#intro{position:fixed;inset:0;background:radial-gradient(ellipse 140% 100% at 50% 38%,#10151b 0%,#060809 72%);color:#eef2f5;overflow:hidden;z-index:200;}
#intro::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 40%,transparent 92%);}
#intro-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;}
.intro-overlay{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;pointer-events:none;}
.intro-caption{font-family:var(--font-body);font-weight:600;font-size:clamp(15px,2.4vw,20px);color:#dfe5ea;letter-spacing:.01em;max-width:640px;opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .45s ease;}
.intro-caption.show{opacity:1;transform:translateY(0);}
.intro-big{font-family:var(--font-mono);font-weight:600;font-size:clamp(64px,14vw,150px);line-height:1;color:#eef2f5;opacity:0;transform:scale(.92);transition:opacity .5s ease,transform .5s ease;}
.intro-big.show{opacity:1;transform:scale(1);}
.intro-big small{display:block;font-family:var(--font-body);font-weight:700;font-size:clamp(12px,1.6vw,16px);letter-spacing:.22em;color:var(--accent);margin-top:10px;text-transform:uppercase;}
.intro-logo{font-family:var(--font-display);font-weight:800;font-size:clamp(48px,9vw,110px);letter-spacing:.01em;text-transform:uppercase;opacity:0;transform:scale(.85);transition:opacity .6s cubic-bezier(.16,.8,.24,1),transform .6s cubic-bezier(.16,.8,.24,1);display:flex;align-items:center;gap:16px;}
.intro-logo.show{opacity:1;transform:scale(1);}
.intro-logo .dot{width:.16em;height:.16em;border-radius:50%;background:var(--accent);box-shadow:0 0 0 .09em rgba(232,134,46,.25);}
.intro-desc{font-family:var(--font-body);font-weight:500;font-size:clamp(13px,1.7vw,15.5px);color:#8f9aa5;letter-spacing:.005em;margin-top:14px;max-width:46ch;opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;}
.intro-desc.show{opacity:1;transform:translateY(0);}
.intro-tagline{font-family:var(--font-body);font-weight:500;font-size:clamp(14px,2vw,19px);color:#aab4bd;margin-top:10px;max-width:52ch;opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;}
.intro-tagline.show{opacity:1;transform:translateY(0);}
#intro-skip{position:absolute;top:22px;right:22px;z-index:5;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:#eef2f5;padding:9px 16px;border-radius:100px;font-size:12.5px;font-weight:600;letter-spacing:.03em;display:flex;align-items:center;gap:6px;transition:background .15s ease,border-color .15s ease;pointer-events:auto;}
#intro-skip:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);}
#intro-enter{position:relative;z-index:5;margin-top:32px;background:var(--accent);color:var(--accent-ink);border:none;padding:16px 30px;border-radius:9px;font-weight:700;font-size:15px;letter-spacing:.01em;display:inline-flex;align-items:center;gap:10px;opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s ease,box-shadow .15s ease,filter .15s ease;pointer-events:none;}
#intro-enter.show{opacity:1;transform:translateY(0);pointer-events:auto;}
#intro-enter:hover{filter:brightness(1.08);box-shadow:0 14px 30px -12px rgba(232,134,46,.55);}
.intro-progress{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:5;}
.intro-progress i{width:20px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);transition:background .2s ease;}
.intro-progress i.done{background:var(--accent);}
.intro-progress i.active{background:#eef2f5;}
#intro.exiting{transition:opacity .28s ease;opacity:0;pointer-events:none;}

/* ============================================================
   AMBIENT BACKGROUND (post-entry, behind app content)
   ============================================================ */
#app-ambient{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--ambient-opacity);filter:blur(.35px);}

/* ============================================================
   APP SHELL
   Note: #app itself is intentionally transparent (not var(--bg))
   so #app-ambient shows through the page gutters/gaps between
   cards. Every actual UI surface below (sidebar, topbar, cards,
   tables, panels) carries its own solid var(--surface)/var(--bg)
   background, so text and controls stay fully opaque and readable
   — only the empty space around them reveals the ambient layer.
   ============================================================ */
#app{display:none;min-height:100vh;background:transparent;position:relative;z-index:1;}
#app.active{display:flex;}
.sidebar{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid var(--border);}
.sidebar-brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.sidebar-brand b{font-weight:800;font-size:18px;letter-spacing:.01em;}
.sidebar-brand small{display:block;font-size:10px;color:var(--text-faint);font-family:var(--font-mono);letter-spacing:.08em;}
.nav-list{list-style:none;padding:12px 10px;flex:1;overflow-y:auto;}
.nav-list li + li{margin-top:2px;}
.nav-link{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text-dim);transition:background .15s ease,color .15s ease;position:relative;text-decoration:none;width:100%;text-align:left;border:none;background:transparent;}
.nav-link svg{width:17px;height:17px;flex-shrink:0;}
.nav-link:hover{background:var(--surface-2);color:var(--text);}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:700;}
.nav-link .badge{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;background:var(--critical-soft);color:var(--critical);padding:1px 6px;border-radius:100px;font-weight:600;}
.nav-more{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
.nav-more-btn .chevron{margin-left:auto;transition:transform .18s ease;}
.nav-more-btn .chevron.open{transform:rotate(180deg);}
.nav-sublist{list-style:none;padding-left:4px;margin-top:2px;}
.nav-sublist li + li{margin-top:2px;}
.sidebar-foot{padding:14px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text-faint);}
.sidebar-foot .demo-chip{display:inline-flex;align-items:center;gap:6px;background:var(--warn-soft);color:var(--warn);border-radius:100px;padding:4px 10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;font-weight:600;margin-bottom:8px;}

.nav-toggle{display:none;background:var(--surface-2);border:1px solid var(--border);width:36px;height:36px;border-radius:8px;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;}
.sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(6,8,10,.45);z-index:69;}
@media (max-width:900px){
  #app.active{position:relative;}
  .sidebar{position:fixed;left:0;top:0;z-index:70;transform:translateX(-100%);transition:transform .25s cubic-bezier(.16,.8,.24,1);box-shadow:16px 0 40px -20px rgba(0,0,0,.3);}
  .sidebar.open{transform:translateX(0);}
  .nav-toggle{display:flex;}
  .sidebar-scrim.open{display:block;}
  .topbar-stats{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 6px;margin-left:0;order:3;padding-top:10px;border-top:1px solid var(--border);margin-top:10px;}
  .tstat{padding:0;text-align:left;border-left:none!important;min-width:0;}
  .tstat .v{font-size:16px;}
  .tstat .l{white-space:normal;}
  .screen{padding:16px;}
}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;width:100%;}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:20;flex-wrap:wrap;}
.topbar h1{font-weight:700;font-size:19px;letter-spacing:-.01em;}
.topbar .sub{font-size:12px;color:var(--text-faint);margin-top:1px;}
.topbar-stats{display:flex;gap:0;margin-left:auto;align-items:stretch;}
.tstat{padding:2px 20px;border-left:1px solid var(--border);text-align:right;}
.tstat:first-child{border-left:none;}
.tstat .v{font-family:var(--font-mono);font-size:19px;font-weight:600;line-height:1.1;}
.tstat .l{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.tstat .v.accent{color:var(--accent);}
.tstat .v.critical{color:var(--critical);}
.tstat .v.good{color:var(--good);}

.screen{padding:26px;max-width:1440px;}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:14px;}
.screen-head h2{font-weight:800;font-size:22px;letter-spacing:-.01em;}
.screen-head p{color:var(--text-dim);font-size:13.5px;margin-top:4px;max-width:60ch;}
.screen-question{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--data);background:var(--data-soft);padding:4px 10px;border-radius:100px;margin-bottom:10px;}

.grid{display:grid;gap:16px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:2fr 1fr;}
@media (max-width:1180px){.g-4{grid-template-columns:repeat(2,1fr);}.g-3{grid-template-columns:repeat(2,1fr);}.g-2{grid-template-columns:1fr;}}
@media (max-width:640px){.g-4,.g-3{grid-template-columns:1fr;}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad{padding:20px 22px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);}
.card-head h3{font-size:14px;font-weight:700;letter-spacing:.01em;}
.card-head .hint{font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}

.stat-tile{padding:18px 20px;}
.stat-tile .l{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.stat-tile .v{font-family:var(--font-mono);font-size:32px;font-weight:600;margin-top:8px;line-height:1;}
.stat-tile .d{font-size:12px;margin-top:8px;color:var(--text-dim);display:flex;align-items:center;gap:6px;}
.stat-tile .d.up{color:var(--good);}
.stat-tile .d.down{color:var(--critical);}

.btn{border-radius:7px;font-weight:600;font-size:13px;padding:9px 16px;border:1px solid var(--border);background:var(--surface);color:var(--text);transition:all .15s ease;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{border-color:var(--text-faint);}
.btn-accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn-accent:hover{filter:brightness(1.08);}
.btn-accent:disabled{opacity:.6;cursor:progress;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn-ghost:hover{background:var(--surface-2);color:var(--text);}
.btn-xl{padding:18px 32px;font-size:16px;border-radius:10px;box-shadow:0 16px 34px -14px rgba(232,134,46,.5);}
.btn-xl:hover{transform:translateY(-2px);box-shadow:0 20px 40px -14px rgba(232,134,46,.6);}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;letter-spacing:.02em;text-transform:uppercase;font-family:var(--font-mono);}
.pill-good{background:var(--good-soft);color:var(--good);}
.pill-warn{background:var(--warn-soft);color:var(--warn);}
.pill-critical{background:var(--critical-soft);color:var(--critical);}
.pill-data{background:var(--data-soft);color:var(--data);}
.pill-neutral{background:var(--surface-2);color:var(--text-dim);}
.pill .dot{width:5px;height:5px;border-radius:50%;background:currentColor;}

table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr{cursor:pointer;transition:background .1s ease;}
tbody tr:hover{background:var(--surface-2);}
tbody tr.selected{background:var(--accent-soft);}
tbody tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.name-cell b{display:block;font-size:13px;}
.name-cell span{display:block;font-size:11px;color:var(--text-faint);font-family:var(--font-mono);margin-top:1px;}
.bar-cell{width:70px;height:6px;background:var(--surface-2);border-radius:100px;overflow:hidden;}
.bar-cell i{display:block;height:100%;background:var(--accent);border-radius:100px;}

.toolbar{display:flex;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.toolbar input[type=search], .toolbar select{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:8px 12px;font-size:12.5px;color:var(--text);}
.toolbar input[type=search]{flex:1;min-width:160px;}
.toolbar .count{margin-left:auto;font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}

.reason-chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:100px;padding:4px 10px;font-size:11px;margin:2px 4px 2px 0;}
.reason-chip b{font-family:var(--font-mono);color:var(--accent);}

.detail-panel{position:fixed;top:0;right:0;height:100vh;width:420px;max-width:92vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:-16px 0 40px -20px rgba(0,0,0,.3);transform:translateX(100%);transition:transform .28s cubic-bezier(.16,.8,.24,1);z-index:60;display:flex;flex-direction:column;}
.detail-panel.open{transform:translateX(0);}
.detail-panel .dp-head{padding:20px 22px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.detail-panel .dp-body{padding:20px 22px;overflow-y:auto;flex:1;}
.dp-close{background:var(--surface-2);border:none;width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
.dp-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--border);font-size:12.5px;}
.dp-row .k{color:var(--text-faint);}
.dp-row .v{font-family:var(--font-mono);font-weight:600;}
.scrim{position:fixed;inset:0;background:rgba(6,8,10,.4);z-index:55;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.scrim.open{opacity:1;pointer-events:auto;}

.agent-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:border-color .15s ease,transform .15s ease;}
.agent-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.agent-card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);}
.agent-card .top{display:flex;justify-content:space-between;align-items:flex-start;}
.agent-avatar{width:38px;height:38px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--data);flex-shrink:0;}
.agent-card h4{font-size:14px;font-weight:700;margin-top:12px;}
.agent-card .zone{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.util-track{height:6px;background:var(--surface-2);border-radius:100px;margin-top:12px;overflow:hidden;}
.util-track i{display:block;height:100%;border-radius:100px;background:var(--data);transition:width .5s ease;}
.util-track i.over{background:var(--critical);}

.delta-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12.5px;opacity:0;transform:translateY(6px);animation:deltaIn .4s ease forwards;}
.delta-row:last-child{border-bottom:none;}
@keyframes deltaIn{to{opacity:1;transform:translateY(0);}}
.delta-row .agent{font-weight:700;flex:0 0 130px;}
.delta-row .nums{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);color:var(--text-dim);}
.delta-row .arrow{color:var(--text-faint);}
.delta-row .after-n{font-weight:700;color:var(--text);}
.delta-badge{font-family:var(--font-mono);font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px;margin-left:auto;}
.delta-badge.pos{background:var(--good-soft);color:var(--good);}
.delta-badge.neg{background:var(--critical-soft);color:var(--critical);}
.delta-badge.zero{background:var(--surface-2);color:var(--text-faint);}

.map-wrap{position:relative;background:var(--surface-2);border-radius:var(--radius);overflow:hidden;}

<script>
/* ================================================================
   SURGE — application script
   Sections: RNG/util → data generation → domain algorithms
   → state → router → render functions per screen → map → doc
   copilot (canvas CV) → native SVG charts → intro engine → init
   ================================================================ */

/* ---------- seeded RNG (deterministic dataset across a session) ---------- */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(20260904);
const pick = (arr) => arr[Math.floor(rng()*arr.length)];
const randInt = (a,b) => Math.floor(a + rng()*(b-a+1));
const randFloat = (a,b) => a + rng()*(b-a);
const fmtINR = (n) => '₹' + Math.round(n).toLocaleString('en-IN');
const fmtLakh = (n) => '₹' + n.toFixed(1) + 'L';
const fmtPct = (n) => n.toFixed(1) + '%';
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
const uid = (prefix,n,len) => prefix + '-' + String(n).padStart(len,'0');
const prefersReducedMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- reference data ---------- */
const ZONES = [
  {id:'Z1', name:'Coastal Andhra', cities:['Amalapuram','Rajahmundry','Kakinada','Vijayawada'], cx:0.22, cy:0.72},
  {id:'Z2', name:'Telangana Belt', cities:['Warangal','Nizamabad','Karimnagar','Khammam'], cx:0.40, cy:0.55},
  {id:'Z3', name:'North Karnataka', cities:['Belagavi','Hubballi','Vijayapura'], cx:0.30, cy:0.38},
  {id:'Z4', name:'West Maharashtra', cities:['Nashik','Solapur','Kolhapur','Aurangabad'], cx:0.55, cy:0.30},
  {id:'Z5', name:'Central India', cities:['Indore','Ujjain','Jabalpur','Gwalior'], cx:0.68, cy:0.60},
  {id:'Z6', name:'Tamil Heartland', cities:['Madurai','Salem','Coimbatore','Tiruchirappalli'], cx:0.78, cy:0.80},
];
const BIZ_PREFIX = ['Sri','Om','Shree','New','Royal','Metro','Annapurna','Balaji','Ganesh','Laxmi','National','City','Krishna','Vinayaka','Sai','Durga','Ashoka','Prime','Star','Classic'];
const BIZ_TYPE = ['Kirana Store','Textiles','General Stores','Traders','Enterprises','Medical & Pharmacy','Electronics','Sweets & Bakery','Hardware Centre','Mobile Zone','Departmental Store','Fashion Hub','Provision Store','Auto Spares','Footwear Corner','Stationery Mart','Fresh Mart','Cafe & Snacks','Agro Centre','Book Depot'];
const FIRST_NAMES = ['Arjun','Priya','Mohammed','Sneha','Ravi','Ananya','Vikram','Deepika','Suresh','Kavya','Rahul','Neha','Karthik','Divya','Faizan','Meera','Aditya','Pooja','Sandeep','Lakshmi','Naveen','Swathi','Imran','Radhika','Bhavesh','Anjali'];
const LAST_NAMES = ['Reddy','Nair','Kulkarni','Teja','Iyer','Singh','Rao','Babu','Menon','Verma','Joshi','Patil','Sharma','Prasad','Kumar','Chowdary','Deshmukh','Pillai','Naidu','Gowda'];

function genBusinessName(city){
  return `${pick(BIZ_PREFIX)} ${pick(BIZ_TYPE)}` + (rng()>.6 ? `, ${city}` : '');
}
function genPersonName(){ return `${pick(FIRST_NAMES)} ${pick(LAST_NAMES)}`; }

/* ---------- merchant + agent generation ---------- */
const TOTAL_MERCHANTS = 500;
const INITIAL_AGENTS = 12;
const INITIAL_DAYS = 9;
const DEADLINE_LABEL = '15 Sep 2026';

function generateMerchants(){
  const list = [];
  for(let i=0;i<TOTAL_MERCHANTS;i++){
    const zone = ZONES[i % ZONES.length];
    const city = pick(zone.cities);
    const turnoverLakh = +(5 + 145*Math.pow(rng(),1.8)).toFixed(1);
    const docReadiness = +randFloat(0.30,0.90).toFixed(2);
    const revenueMonthly = Math.round((8000 + 900000*Math.pow(rng(),2.1)));
    const priorAttempts = rng()>0.78 ? randInt(1,2) : 0;
    const contacted = rng()>0.55;
    const docsUploaded = rng()>0.4;
    list.push({
      id: uid('MID', 88230000+i, 8),
      name: genBusinessName(city),
      city, zoneId: zone.id, zoneName: zone.name,
      turnoverLakh, docReadiness, revenueMonthly,
      priorAttempts, contacted, docsUploaded,
      status: priorAttempts>0 ? 'failed_attempt' : (contacted ? 'scheduled' : 'pending'),
      qrSoundbox: rng()>0.5 ? 'Soundbox' : 'QR Only',
      lastContact: priorAttempts>0 ? `${randInt(2,8)} days ago` : (contacted ? `${randInt(1,4)} days ago` : 'Never contacted'),
      angle: randFloat(0,Math.PI*2), radius: randFloat(0.05,0.16),
    });
  }
  return list;
}
function generateAgents(count){
  const list = [];
  for(let i=0;i<count;i++){
    const zone = ZONES[i % ZONES.length];
    list.push({
      id: uid('AGT', 100+i, 3),
      name: genPersonName(),
      zoneId: zone.id, zoneName: zone.name,
      status: rng()>0.15 ? 'active' : 'travelling',
      capacity: 0, assigned: 0,
      loadFactor: +randFloat(0.8,1.22).toFixed(2),
    });
  }
  return list;
}

const MERCHANTS = generateMerchants();
const AGENTS_MASTER = generateAgents(INITIAL_AGENTS);

/* ================================================================
   DOMAIN ALGORITHMS
   ================================================================ */

/* Compliant-path eligibility — mirrors RBI PA-PG 2025 lighter path for
   merchants at/under ₹40L turnover with adequate existing documentation. */
function evaluateCompliantPath(m){
  const turnoverOk = m.turnoverLakh <= 40;
  const docsOk = m.docReadiness >= 0.6;
  const eligible = turnoverOk && docsOk;
  return {
    eligible,
    rules: [
      {label:`Annual turnover ₹${m.turnoverLakh}L ${turnoverOk?'≤':'>'} ₹40L threshold`, pass:turnoverOk},
      {label:`Existing document quality score ${(m.docReadiness*100).toFixed(0)}% ${docsOk?'≥':'<'} 60% bar`, pass:docsOk},
      {label:'PAN + business registration on file', pass:m.docsUploaded},
    ],
    path: eligible ? 'Remote / Video-KYC (4-step light path)' : 'In-person field verification required',
  };
}

/* Explainable priority score, 0-100. Blends two components — a deadline/
   urgency component (revisit pressure, prior failed attempts, document
   risk) and a business-impact component (revenue at risk) — according to
   focusWeight (0 = pure deadline urgency, 1 = pure business impact,
   0.5 = the original balanced default used everywhere except the AI
   Priority screen's slider). */
function computePriority(m, daysRemaining, focusWeight=0.5){
  const fw = clamp(focusWeight, 0, 1);
  const businessMult = fw*2;        // 0 → 2
  const urgencyMult = (1-fw)*2;     // 2 → 0
  const reasons = [];
  let score = 0;

  const revPts = clamp(m.revenueMonthly/900000*42, 0, 42) * businessMult;
  score += revPts;
  reasons.push({label:`${fmtINR(m.revenueMonthly)}/mo transaction volume at risk`, pts:revPts, kind:'business'});

  const expectedVisits = 1 + (1-m.docReadiness)*1.4;
  const pressure = clamp((expectedVisits/Math.max(daysRemaining,1))*100, 0, 34) * urgencyMult;
  score += pressure;
  reasons.push({label:`Needs ~${expectedVisits.toFixed(1)} visits, ${daysRemaining}d left`, pts:pressure, kind:'urgency'});

  const attemptPts = m.priorAttempts * 12 * urgencyMult;
  score += attemptPts;
  if(m.priorAttempts>0) reasons.push({label:`${m.priorAttempts} prior failed attempt(s)`, pts:attemptPts, kind:'urgency'});

  const docPts = (1-m.docReadiness) * 12 * urgencyMult;
  score += docPts;
  reasons.push({label:`Document readiness ${(m.docReadiness*100).toFixed(0)}% — revisit risk`, pts:docPts, kind:'urgency'});

  return {score: clamp(Math.round(score),0,100), reasons: reasons.sort((a,b)=>b.pts-a.pts), focusWeight:fw};
}

/* Core simulation engine — day-by-day capacity model.
   optimizedRouting: zone-clustered dispatch + priority ordering, higher
     effective daily capacity per agent (less cross-zone travel waste).
   docCopilot: +success-probability & +capacity from catching bad docs
     before an agent leaves (fewer wasted return trips).
   compliantOffload: RBI-eligible merchants routed off the field queue
     entirely via the remote/video path.
   repeatVisitRate (0-30, %): merchants who no-show / reschedule and need
     a repeat visit — reduces effective per-visit success probability. */
function runSimulation({agentCount, days, optimizedRouting, docCopilot, compliantOffload, repeatVisitRate=0}){
  // Seed a local RNG from the exact input combination so identical
  // settings always reproduce identical results (a real projection
  // tool shouldn't jitter between two runs of the same scenario —
  // this was previously drawing from the shared, unseeded
  // Math.random(), so re-running the same What-If settings could
  // silently show a different number each time).
  const simSeedStr = `${agentCount}|${days}|${optimizedRouting}|${docCopilot}|${compliantOffload}|${repeatVisitRate}`;
  let simSeed = 0;
  for(let i=0;i<simSeedStr.length;i++){ simSeed = (simSeed*31 + simSeedStr.charCodeAt(i)) | 0; }
  const simRng = mulberry32(simSeed ^ 0x53555247); // ^ 'SURG' bytes, keeps it distinct from the dataset RNG
  let pool = MERCHANTS.map(m => ({...m, attempts:0}));
  let offloaded = [];
  if(compliantOffload){
    offloaded = pool.filter(m => evaluateCompliantPath(m).eligible);
    const offIds = new Set(offloaded.map(m=>m.id));
    pool = pool.filter(m => !offIds.has(m.id));
  }

  if(optimizedRouting){
    pool.forEach(m => m._pr = computePriority(m, days).score);
    pool.sort((a,b) => a.zoneId.localeCompare(b.zoneId) || b._pr - a._pr);
  }

  const capPerAgent = optimizedRouting ? 6.0 : 5.3;
  const capMult = docCopilot ? 1.06 : 1.0;
  const dailyCapacityPerAgent = +(capPerAgent*capMult).toFixed(2);
  const totalDailyCapacity = Math.max(1, Math.floor(dailyCapacityPerAgent * agentCount));

  const repeatPenalty = clamp(repeatVisitRate,0,30)/100 * 0.6;

  let verified = 0;
  let queue = pool.slice();
  const timeline = [];
  const successBoost = docCopilot ? 0.08 : 0;

  for(let d=1; d<=days; d++){
    let slots = totalDailyCapacity;
    const revisits = [];
    while(slots>0 && queue.length>0){
      const m = queue.shift();
      slots--;
      const p = clamp(m.docReadiness + successBoost + m.attempts*0.15 - repeatPenalty, 0.05, 0.97);
      if(simRng() < p){ verified++; }
      else { m.attempts++; revisits.push(m); }
    }
    queue = optimizedRouting ? revisits.concat(queue) : queue.concat(revisits);
    const criticalRemainingDay = queue.filter(m => m.revenueMonthly > 200000).length;
    timeline.push({
      day:d,
      pct: +(((verified+offloaded.length)/MERCHANTS.length)*100).toFixed(1),
      revenueProtected: Math.round((verified+offloaded.length)/MERCHANTS.length * MERCHANTS.reduce((s,m)=>s+m.revenueMonthly,0)),
      criticalRemaining: criticalRemainingDay,
    });
  }

  const totalVerified = verified + offloaded.length;
  const remaining = queue.length;
  const totalRevenue = MERCHANTS.reduce((s,m)=>s+m.revenueMonthly,0);
  const protectedRevenue = timeline.length ? timeline[timeline.length-1].revenueProtected : 0;
  const criticalRemaining = queue.filter(m => m.revenueMonthly > 200000).length;

  return {
    completionPct: +(((totalVerified)/MERCHANTS.length)*100).toFixed(1),
    verifiedCount: totalVerified,
    offloadedCount: offloaded.length,
    fieldVerified: verified,
    remainingCount: remaining,
    criticalRemaining,
    dailyCapacityPerAgent,
    totalDailyCapacity,
    timeline,
    totalRevenue,
    protectedRevenue,
    agentCount, days, optimizedRouting, docCopilot, compliantOffload, repeatVisitRate,
  };
}

/* fuzzy string match (Levenshtein-based similarity, 0-1) — used by the
   document-identity match tool */
function levenshtein(a,b){
  a=a.toLowerCase().trim(); b=b.toLowerCase().trim();
  const m=a.length,n=b.length;
  const dp = Array.from({length:m+1},(_,i)=>[i].concat(Array(n).fill(0)));
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
  }
  return dp[m][n];
}
function nameSimilarity(a,b){
  if(!a||!b) return 0;
  const dist = levenshtein(a,b);
  const maxLen = Math.max(a.length,b.length,1);
  return clamp(1 - dist/maxLen, 0, 1);
}

/* required-agent search — smallest field headcount that hits ~95%
   projected completion under the given constraints (used by the
   What-If Simulator's "Required Agents" output) */
function computeRequiredAgents({days, optimizedRouting, docCopilot, compliantOffload, repeatVisitRate}){
  for(let a=3;a<=40;a++){
    const res = runSimulation({agentCount:a, days, optimizedRouting, docCopilot, compliantOffload, repeatVisitRate});
    if(res.completionPct>=95) return a;
  }
  return '40+';
}

/* Pure: compute per-agent workload for a given simulation result, without
   mutating state. Used for Field Operations Before/After and for the map. */
function computeAgentWorkloads(result){
  const zoneGroups = {};
  ZONES.forEach(z => zoneGroups[z.id] = []);
  MERCHANTS.forEach(m => { if(zoneGroups[m.zoneId]) zoneGroups[m.zoneId].push(m); });
  return state.agents.map(a => {
    const pool = (zoneGroups[a.zoneId]||[]).slice().sort((x,y)=>computePriority(y,state.daysRemaining).score - computePriority(x,state.daysRemaining).score);
    const cap = result ? Math.max(3, Math.round(result.dailyCapacityPerAgent)) : 6;
    const targetAssigned = Math.min(pool.length, Math.max(1, Math.round(cap * a.loadFactor)));
    const workload = pool.slice(0, targetAssigned);
    const assigned = workload.length;
    const utilPct = clamp(Math.round((assigned/cap)*100),0,140);
    return {id:a.id, name:a.name, zoneId:a.zoneId, zoneName:a.zoneName, status:a.status, capacity:cap, assigned, utilPct, workload};
  });
}
/* Back-compat mutator used by map/analytics/alerts — writes the current-
   mode workload onto state.agents in place. */
function buildAgentWorkloads(){
  const computed = computeAgentWorkloads(currentResult());
  computed.forEach((c,i)=>Object.assign(state.agents[i], c));
}

/* ================================================================
   ANIMATION HELPERS
   ================================================================ */
function animateNumber(el, from, to, opts={}){
  if(!el) return;
  if(prefersReducedMotion() || from===to){ el.textContent = (opts.format?opts.format(to):to); return; }
  const dur = opts.duration || 700;
  const start = performance.now();
  const fmt = opts.format || (v => Math.round(v));
  function step(now){
    const t = clamp((now-start)/dur, 0, 1);
    const eased = 1 - Math.pow(1-t, 3);
    const v = from + (to-from)*eased;
    el.textContent = fmt(v);
    if(t<1) requestAnimationFrame(step); else el.textContent = fmt(to);
  }
  requestAnimationFrame(step);
}
function crossFade(el, newHtml){
  if(!el) return;
  if(prefersReducedMotion()){ el.innerHTML = newHtml; return; }
  el.style.transition = 'opacity .18s ease';
  el.style.opacity = 0;
  setTimeout(()=>{ el.innerHTML = newHtml; el.style.opacity = 1; }, 180);
}
/* FLIP reorder: call captureFlip() before DOM changes, mutate DOM, then
   call playFlip() with the same container/selector to animate the delta. */
function captureFlipState(container, selector){
  const map = new Map();
  container.querySelectorAll(selector).forEach(el => {
    map.set(el.dataset.id, el.getBoundingClientRect());
  });
  return map;
}
function playFlip(container, selector, firstRects){
  if(prefersReducedMotion()) return;
  container.querySelectorAll(selector).forEach(el => {
    const first = firstRects.get(el.dataset.id);
    if(!first) return;
    const last = el.getBoundingClientRect();
    const dy = first.top - last.top;
    if(Math.abs(dy) < 1) return;
    el.style.transition = 'none';
    el.style.transform = `translateY(${dy}px)`;
    requestAnimationFrame(()=>{
      el.style.transition = 'transform .45s cubic-bezier(.16,.8,.24,1)';
      el.style.transform = '';
    });
  });
}

function scoredMerchants(focusWeight){
  return MERCHANTS.map(m => ({m, p: computePriority(m, state.daysRemaining, focusWeight)}))
    .sort((a,b)=>b.p.score-a.p.score);
}
function riskTier(score){
  if(score>=70) return {label:'High', cls:'pill-critical'};
  if(score>=40) return {label:'Medium', cls:'pill-warn'};
  return {label:'Low', cls:'pill-good'};
}
function recommendedAction(m, cp){
  if(cp.eligible) return 'Route via remote / video-KYC — no field visit needed.';
  if(m.priorAttempts>0) return `Re-dispatch to a senior agent in ${m.zoneName} — prior attempt failed.`;
  if(m.docReadiness<0.5) return `Flag for Document Copilot pre-check before the ${m.zoneName} agent departs.`;
  return `Dispatch to next available agent in ${m.zoneName}.`;
}
function whyBullets(m, p){
  return p.reasons.slice(0,3).map(r=>`${r.label} (+${Math.round(r.pts)} pts)`);
}
function priorityCardHtml(m, p, rank){
  const cp = evaluateCompliantPath(m);
  const risk = riskTier(p.score);
  return `
  <div class="p-card" data-id="${m.id}">

    <div class="p-meta">

function updatePriorityRanking(){
  const root = document.getElementById('screen-root');
  if(!root || state.route!=='priority-queue') return;
  const fw = state.priorityFocus;
  const scored = scoredMerchants(fw);
  const prevRanks = state.priorityRankPrev;
  const newRanks = new Map(scored.map((s,i)=>[s.m.id,i]));

  // update slider caption
  const valEl = document.getElementById('focus-value');
  if(valEl) valEl.textContent = `Blend: ${Math.round((1-fw)*100)}% urgency · ${Math.round(fw*100)}% business impact`;

  // cards: simple re-render (top 9 changes composition/order)
  const cardsEl = document.getElementById('priority-cards');
  if(cardsEl){
    const top9 = scored.slice(0,9);
    cardsEl.innerHTML = top9.map(({m,p},i)=>priorityCardHtml(m,p,i)).join('');
  }

  // list: FLIP reorder
  const listEl = document.getElementById('priority-list');
  if(listEl){
    const first = captureFlipState(listEl, '[data-id]');
    const list60 = scored.slice(0,60);
    listEl.innerHTML = list60.map(({m,p},i) => priorityListRowHtml(m,p,i)).join('');
    playFlip(listEl, '[data-id]', first);
  }

  // mover toast: biggest rank change among top 60
  let biggest = null;
  newRanks.forEach((rank,id)=>{
    if(rank>59) return;
    const prev = prevRanks.get(id);
    if(prev===undefined) return;
    const delta = prev - rank;
    if(Math.abs(delta) >= 6 && (!biggest || Math.abs(delta) > Math.abs(biggest.delta))){
      biggest = {id, prev, rank, delta};
    }
  });
  const toast = document.getElementById('rank-toast');
  if(toast){
    if(biggest){
      const m = MERCHANTS.find(x=>x.id===biggest.id);
      const dir = biggest.delta>0 ? 'up' : 'down';
      const reason = fw>0.5 ? 'business impact weighted higher' : 'deadline urgency weighted higher';
      toast.innerHTML = `◆ <b>${m.name}</b> moved from #${biggest.prev+1} → #${biggest.rank+1} — ${reason}`;
      toast.classList.add('show');
      clearTimeout(toast._hideTimer);
      toast._hideTimer = setTimeout(()=>toast.classList.remove('show'), 3200);
    } else {
      toast.classList.remove('show');
    }
  }

  state.priorityRankPrev = newRanks;
  wirePriorityWhyButtons();
  wireOpenMerchantLinks();
}

  document.querySelectorAll('[data-why]').forEach(btn=>{

      const open = body.classList.toggle('open');

    y: zp.y + Math.sin(m.angle)*m.radius*H*0.9,
  };
}

    const g = document.createElementNS(NS,'g');
    g.style.cursor='pointer';
    const dot = document.createElementNS(NS,'circle');
    dot.setAttribute('r',7); dot.setAttribute('fill','var(--accent)'); dot.setAttribute('stroke','#fff'); dot.setAttribute('stroke-width','1.5');
    g.appendChild(dot);
    svg.appendChild(g);
    g.addEventListener('click', ()=>{ navigate('field-operations'); setTimeout(()=>openAgentPanel(a.id),50); });
    g.addEventListener('mousemove',(e)=>showMapTip(e,`${a.name}\n${a.assigned}/${a.capacity} visits today`));
    g.addEventListener('mouseleave', hideMapTip);
    return {g, zp, phase: i*0.7, speedMul: 0.6+rng()*0.6};
  }).filter(Boolean);

  window.__surgeMapRaf && cancelAnimationFrame(window.__surgeMapRaf);
  if(prefersReducedMotion()){
    agentEls.forEach(ae => ae.g.setAttribute('transform', `translate(${ae.zp.x+19},${ae.zp.y})`));
  } else {
    const start = performance.now();
    function tick(now){
      const t = (now-start)/1000;
      agentEls.forEach(ae => {
        const ang = t*0.4*ae.speedMul + ae.phase;
        const x = ae.zp.x + Math.cos(ang)*19;
        const y = ae.zp.y + Math.sin(ang)*19;
        ae.g.setAttribute('transform', `translate(${x},${y})`);
      });
      window.__surgeMapRaf = requestAnimationFrame(tick);
    }
    window.__surgeMapRaf = requestAnimationFrame(tick);
  }

  // zone stat cards below map
  const zc = document.getElementById('zone-stat-cards');
  if(zc){
    zc.innerHTML = ZONES.map(z=>{
      const zm = MERCHANTS.filter(m=>m.zoneId===z.id);
      const crit = zm.filter(m=>m.revenueMonthly>200000).length;
      const avgP = Math.round(zm.reduce((s,m)=>s+computePriority(m,state.daysRemaining).score,0)/zm.length);
      return `<div class="card stat-tile"><div class="l">${z.name}</div><div class="v">${zm.length}</div><div class="d">${crit} critical · avg priority ${avgP}</div></div>`;
    }).join('');
  }
}
/* Draws each agent's route (hub → top 3 assigned merchants). animate=true
   fades the old paths out, then draws the new ones in with a stroke
   dashoffset animation — used after Optimize recalculates assignments. */
function drawMapRoutes(animate){
  const svg = document.getElementById('opmap');
  const group = document.getElementById('routes-group');
  if(!svg || !group) return;
  const NS = 'http://www.w3.org/2000/svg';
  const zonePos = window.__surgeMapZonePos, W = window.__surgeMapW, H = window.__surgeMapH;
  const workloads = computeAgentWorkloads(currentResult());

  function paintNew(){
    group.innerHTML = '';
    workloads.forEach(a => {
      const zp = zonePos[a.zoneId]; if(!zp) return;
      const stops = a.workload.slice(0,3).map(m => merchantXY(m, zonePos, W, H));
      if(!stops.length) return;
      const d = `M ${zp.x} ${zp.y} ` + stops.map(s=>`L ${s.x} ${s.y}`).join(' ');
      const path = document.createElementNS(NS,'path');
      path.setAttribute('d', d);
      path.setAttribute('fill','none');
      path.setAttribute('stroke','var(--accent)');
      path.setAttribute('stroke-width','1.4');
      path.setAttribute('stroke-linecap','round');
      path.setAttribute('opacity','0.55');
      path.setAttribute('class','agent-route');
      group.appendChild(path);
      if(!prefersReducedMotion()){
        try{
          const len = path.getTotalLength();
          path.style.strokeDasharray = len;
          path.style.strokeDashoffset = len;
          requestAnimationFrame(()=>{
            path.style.transition = 'stroke-dashoffset .6s cubic-bezier(.16,.8,.24,1)';
            path.style.strokeDashoffset = 0;
          });
        }catch(e){}
      }
    });
  }

  if(animate && group.children.length && !prefersReducedMotion()){
    Array.from(group.children).forEach(p => { p.style.transition='opacity .25s ease'; p.style.opacity='0'; });
    setTimeout(paintNew, 260);
  } else {
    paintNew();
  }
}

function analyzeImageFile(file){
  const resultEl = document.getElementById('doc-result');
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (e) => { img.src = e.target.result; };
  reader.readAsDataURL(file);
  img.onload = () => {
    resultEl.innerHTML = `
      <div class="doc-preview"><img src="${img.src}" class="captured-img"><div class="scan-bar"></div></div>
      <div class="analyzing-line"><span class="spin"></span>SURGE analyzing capture quality…</div>
    `;
    const canvas = document.createElement('canvas');
    const maxDim = 300;
    const scale = Math.min(1, maxDim/Math.max(img.width,img.height));
    canvas.width = Math.max(1,Math.round(img.width*scale));
    canvas.height = Math.max(1,Math.round(img.height*scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const data = ctx.getImageData(0,0,canvas.width,canvas.height).data;

    // grayscale + brightness
    const w=canvas.width,h=canvas.height;
    const gray = new Float32Array(w*h);
    let sum=0;
    for(let i=0;i<w*h;i++){
      const r=data[i*4], g=data[i*4+1], b=data[i*4+2];
      const v = 0.299*r+0.587*g+0.114*b;
      gray[i]=v; sum+=v;
    }
    const brightness = sum/(w*h);

    // laplacian variance (sharpness) — real edge-based blur detection
    let lapSum=0, lapSumSq=0, n=0;
    for(let y=1;y<h-1;y++){
      for(let x=1;x<w-1;x++){
        const idx=y*w+x;
        const lap = gray[idx-1]+gray[idx+1]+gray[idx-w]+gray[idx+w]-4*gray[idx];
        lapSum+=lap; lapSumSq+=lap*lap; n++;
      }
    }
    const mean = lapSum/Math.max(n,1);
    const variance = lapSumSq/Math.max(n,1) - mean*mean;

    const sharpOk = variance > 220;
    const brightOk = brightness > 55 && brightness < 220;
    const resOk = img.width>=480 && img.height>=480;

    const checks = [
      {label:'Sharpness', detail:`Edge-variance score ${variance.toFixed(0)} (need ≥220)`, pass:sharpOk, fail_msg:'Image is blurry — ask merchant to retake in better light or hold steady.'},
      {label:'Exposure', detail:`Average brightness ${brightness.toFixed(0)}/255`, pass:brightOk, fail_msg: brightness<=55 ? 'Image too dark — retake with more light.' : 'Image overexposed / glare detected — retake avoiding direct light.'},
      {label:'Resolution', detail:`${img.width}×${img.height}px (need ≥480×480)`, pass:resOk, fail_msg:'Resolution too low for legible text — recapture at higher quality.'},
    ];
    const allPass = checks.every(c=>c.pass);
    const qualityScore = Math.round(checks.filter(c=>c.pass).length/checks.length*100);

    setTimeout(()=>{
      resultEl.innerHTML = `
        <div class="doc-preview"><img src="${img.src}" class="captured-img"></div>
        <div style="display:flex;align-items:center;gap:10px;margin:14px 0 6px;">
          <div class="priority-score" style="--pct:${qualityScore}"><span>${qualityScore}</span></div>
          <div><b style="font-size:13.5px;">Quality Score</b><div style="font-size:11.5px;color:var(--text-faint);">${allPass?'Capture accepted':'Recapture recommended'}</div></div>
        </div>
        <div class="pill ${allPass?'pill-good':'pill-warn'}" style="margin-bottom:6px;">${allPass?'✓ Capture Accepted':'⚠ Recapture Recommended'}</div>
        ${checks.map(c=>`
          <div class="doc-check">
            <div class="check-ic ${c.pass?'pass':'fail'}">${c.pass?'✓':'!'}</div>
            <div><b>${c.label}</b><p>${c.detail}${!c.pass?' — '+c.fail_msg:''}</p></div>
          </div>
        `).join('')}
        <p style="font-size:11px;color:var(--text-faint);margin-top:10px;">Real client-side analysis (Laplacian edge-variance + luminance histogram) — computed from the pixels of the image you just uploaded, not a canned result.</p>
      `;
    }, prefersReducedMotion() ? 0 : 700);
  };
}

/* ================================================================
   NATIVE SVG CHARTS (dependency-free — no Chart.js, no CDN, works
   fully offline. Uses the app's CSS custom-property color tokens so
   charts respect light/dark theme automatically.)
   ================================================================ */
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim() || '#c5601f'; }
const SVG_NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const el = document.createElementNS(SVG_NS, tag);
  for(const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
/* svgLineChart(container, series, opts) — series: [{label,color,data:[{x,y}]}] */
function svgLineChart(container, series, opts={}){
  if(!container) return;
  const W = 560, H = 220, pad = {t:14,r:14,b:26,l:34};
  const allY = series.flatMap(s=>s.data.map(d=>d.y));
  const maxY = opts.maxY!==undefined ? opts.maxY : Math.max(1, ...allY) * 1.12;
  const minY = 0;
  const xs = series[0] ? series[0].data.map(d=>d.x) : [];
  const n = xs.length || 1;
  const xPos = (i) => pad.l + (i/(n-1||1)) * (W-pad.l-pad.r);
  const yPos = (v) => H-pad.b - ((v-minY)/(maxY-minY||1)) * (H-pad.t-pad.b);

  const svg = svgEl('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', height:'100%', preserveAspectRatio:'xMidYMid meet'});
  svg.style.display='block';
  // gridlines + y labels
  const gridColor = getCss('--border'), textColor = getCss('--text-faint');
  for(let g=0; g<=4; g++){
    const v = maxY*g/4;
    const y = yPos(v);
    svg.appendChild(svgEl('line', {x1:pad.l, x2:W-pad.r, y1:y, y2:y, stroke:gridColor, 'stroke-width':1}));
    const t = svgEl('text', {x:4, y:y+3, fill:textColor, 'font-size':9, 'font-family':'IBM Plex Mono, monospace'});
    t.textContent = Math.round(v) + (opts.suffix||'');
    svg.appendChild(t);
  }
  // x labels (sparse)
  xs.forEach((x,i) => {
    if(n>8 && i%Math.ceil(n/6)!==0 && i!==n-1) return;
    const t = svgEl('text', {x:xPos(i), y:H-6, fill:textColor, 'font-size':9, 'font-family':'IBM Plex Mono, monospace', 'text-anchor':'middle'});
    t.textContent = x;
    svg.appendChild(t);
  });
  // series
  series.forEach(s => {
    const pts = s.data.map((d,i)=>`${xPos(i)},${yPos(d.y)}`).join(' ');
    if(s.fill){
      const areaPts = `${xPos(0)},${yPos(0)} ${pts} ${xPos(s.data.length-1)},${yPos(0)}`;
      svg.appendChild(svgEl('polygon', {points:areaPts, fill:s.color, opacity:0.14}));
    }
    const poly = svgEl('polyline', {points:pts, fill:'none', stroke:s.color, 'stroke-width':2, 'stroke-linejoin':'round', 'stroke-linecap':'round'});
    if(s.dashed) poly.setAttribute('stroke-dasharray','5 4');
    svg.appendChild(poly);
    s.data.forEach((d,i) => {
      svg.appendChild(svgEl('circle', {cx:xPos(i), cy:yPos(d.y), r:2.4, fill:s.color}));
    });
  });
  container.innerHTML = '';
  container.appendChild(svg);
  if(series.length>1 && opts.legend!==false){
    const leg = document.createElement('div');
    leg.style.cssText = 'display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;';
    leg.innerHTML = series.map(s=>`<span style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);font-family:var(--font-mono);"><span style="width:9px;height:9px;border-radius:50%;background:${s.color};display:inline-block;"></span>${s.label}</span>`).join('');
    container.appendChild(leg);
  }
}
/* svgBarChart(container, data, opts) — data: [{label,value,color}] */
function svgBarChart(container, data, opts={}){
  if(!container) return;
  const horizontal = !!opts.horizontal;
  const W = 560, H = 220, pad = horizontal ? {t:8,r:34,b:8,l:96} : {t:14,r:10,b:34,l:30};
  const maxV = opts.maxV !== undefined ? opts.maxV : Math.max(1, ...data.map(d=>d.value)) * 1.15;
  const textColor = getCss('--text-faint'), gridColor = getCss('--border');
  const svg = svgEl('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', height:'100%', preserveAspectRatio:'xMidYMid meet'});
  svg.style.display='block';
  const n = data.length || 1;
  if(horizontal){
    const bh = (H-pad.t-pad.b)/n * 0.62;
    const gap = (H-pad.t-pad.b)/n;
    data.forEach((d,i)=>{
      const y = pad.t + i*gap + (gap-bh)/2;
      const w = (d.value/maxV) * (W-pad.l-pad.r);
      svg.appendChild(svgEl('text', {x:pad.l-8, y:y+bh/2+3, fill:textColor, 'font-size':10, 'text-anchor':'end', 'font-family':'Inter,sans-serif'})).textContent = d.label;
      const bar = svgEl('rect', {x:pad.l, y, width:0, height:bh, rx:3, fill:d.color||getCss('--data')});
      svg.appendChild(bar);
      requestAnimationFrame(()=>{ bar.style.transition='width .55s cubic-bezier(.16,.8,.24,1)'; bar.setAttribute('width', Math.max(1,w)); });
      const vt = svgEl('text', {x:pad.l+w+6, y:y+bh/2+3, fill:'var(--text)', 'font-size':10, 'font-family':'IBM Plex Mono, monospace'});
      vt.textContent = d.value;
      svg.appendChild(vt);
    });
  } else {
    for(let g=0; g<=3; g++){
      const v = maxV*g/3;
      const y = H-pad.b - (v/maxV)*(H-pad.t-pad.b);
      svg.appendChild(svgEl('line', {x1:pad.l, x2:W-pad.r, y1:y, y2:y, stroke:gridColor, 'stroke-width':1}));
    }
    const bw = (W-pad.l-pad.r)/n * 0.6;
    const gap = (W-pad.l-pad.r)/n;
    data.forEach((d,i)=>{
      const x = pad.l + i*gap + (gap-bw)/2;
      const h = (d.value/maxV) * (H-pad.t-pad.b);
      const bar = svgEl('rect', {x, y:H-pad.b, width:bw, height:0, rx:3, fill:d.color||getCss('--data')});
      svg.appendChild(bar);
      requestAnimationFrame(()=>{ bar.style.transition='height .55s cubic-bezier(.16,.8,.24,1), y .55s cubic-bezier(.16,.8,.24,1)'; bar.setAttribute('height', Math.max(1,h)); bar.setAttribute('y', H-pad.b-h); });
      svg.appendChild(svgEl('text', {x:x+bw/2, y:H-8, fill:textColor, 'font-size':9, 'text-anchor':'middle', 'font-family':'Inter,sans-serif'})).textContent = d.label;
    });
  }
  container.innerHTML = '';
  container.appendChild(svg);
}

/* ================================================================
   SCREEN: ALERTS (secondary)
   ================================================================ */
function computeAlerts(){
  // Every alert below is recomputed synchronously from the current
  // MERCHANTS/agents/zone state on each render — there is no
  // background event log, so "when" labels describe why the alert
  // exists rather than claiming a fake elapsed time (a prior version
  // hardcoded strings like "12 min ago", which would never change
  // and could read as fake activity in a demo).
  const alerts = [];
  const critical = MERCHANTS.filter(m => m.revenueMonthly>250000 && m.priorAttempts>0);
  critical.slice(0,4).forEach(m => alerts.push({
    level:'critical', title:`${m.name} at risk of missing deadline`,
    detail:`${fmtINR(m.revenueMonthly)}/mo volume, ${m.priorAttempts} failed attempt(s), ${state.daysRemaining} days left.`,
    when:'Live', id:m.id,
  }));
  buildAgentWorkloads();
  state.agents.filter(a=>a.utilPct>112).slice(0,4).forEach(a => alerts.push({
    level:'warn', title:`${a.name} over daily capacity`,
    detail:`${a.assigned} visits assigned against ${a.capacity} capacity in ${a.zoneName}.`,
    when:'Live',
  }));
  const zoneBacklog = ZONES.map(z => ({z, n: MERCHANTS.filter(m=>m.zoneId===z.id && m.status!=='verified').length}))
    .sort((a,b)=>b.n-a.n)[0];
  if(zoneBacklog) alerts.push({
    level:'warn', title:`${zoneBacklog.z.name} carries the largest backlog`,
    detail:`${zoneBacklog.n} merchants still pending verification — consider reallocating an agent from a lighter zone.`,
    when:'Live',
  });
  alerts.push({level:'good', title:'Compliant-path rule engine active', detail:`${MERCHANTS.filter(m=>evaluateCompliantPath(m).eligible).length} merchants currently qualify for the remote path and can be offloaded from field queues.`, when:'Live'});
  if(state.daysRemaining<=10) alerts.push({level:'critical', title:'Deadline inside 10-day window', detail:`RBI re-KYC deadline is ${DEADLINE_LABEL}. At current baseline pace, ${(100-(state.baselineResult?.completionPct||71)).toFixed(0)}% of the backlog is projected to miss it.`, when:'Live'});
  return alerts;
}
function renderAlerts(){
  ensureBaseline();
  const alerts = computeAlerts();
  const icons = {critical:'!', warn:'⚠', good:'✓'};
  return `
  <div class="card">
    <div class="card-head"><h3>Active Alerts</h3><span class="hint">${alerts.length} items · computed live from current backlog</span></div>
    <div>
    ${alerts.map(a => `
      <div class="alert-row ${a.level}" ${a.id?`data-open-merchant="${a.id}" style="cursor:pointer;"`:''}>
        <div class="alert-ic">${icons[a.level]}</div>
        <div><h4>${a.title}</h4><p>${a.detail}</p></div>
        <div class="when">${a.when}</div>
      </div>
    `).join('')}
    </div>
  </div>
  `;
}

/* ================================================================
   OPTIMIZE FLOW — real staged sequence, then KPIs animate old→new.
   onFinish(before, after) lets the calling screen decide how to
   present the transition (Command Center animates 2 KPI numbers,
   Field Operations re-renders the Before→After delta rows, Live Map
   redraws routes with a fade/draw transition).
   ================================================================ */
function runOptimizeSequence(onFinish){
  const overlay = document.getElementById('optimize-overlay');
  const stepsEl = document.getElementById('opt-steps');
  const steps = ['Analyzing backlog…','Evaluating deadline pressure…','Allocating agent capacity…','Optimizing assignments…','Plan ready.'];
  stepsEl.innerHTML = steps.map(s=>`<div class="step">${s}</div>`).join('');
  overlay.classList.add('show');
  const stepEls = [...stepsEl.children];
  document.querySelectorAll('[data-optimize-btn]').forEach(b=>b.disabled = true);
  const stepDur = prefersReducedMotion() ? 0 : 420;
  let i=0;
  function next(){
    if(i>0) stepEls[i-1].classList.add('done');
    if(i<stepEls.length){ stepEls[i].classList.add('show'); i++; setTimeout(next, stepDur); }
    else {
      setTimeout(()=>{
        const before = currentResult();
        const after = runSimulation({agentCount:state.agents.length, days:state.daysRemaining, optimizedRouting:true, docCopilot:true, compliantOffload:false});
        state.optimizedResult = after;
        state.mode = 'optimized';
        overlay.classList.remove('show');
        document.querySelectorAll('[data-optimize-btn]').forEach(b=>b.disabled = false);
        if(typeof onFinish === 'function') onFinish(before, after); else navigate('command-center');
      }, prefersReducedMotion() ? 0 : 350);
    }
  }
  next();
}
function animateTopbarStats(before, after){
  const compEl = document.getElementById('tb-completion'), critEl = document.getElementById('tb-critical');
  if(compEl) animateNumber(compEl, before.completionPct, after.completionPct, {format:fmtPct});
  if(critEl) animateNumber(critEl, before.criticalRemaining, after.criticalRemaining, {format:v=>Math.round(v)});
}
function onOptimizeFromCommandCenter(before, after){
  navigate('command-center');
  const compEl = document.getElementById('kpi-completion'), critEl = document.getElementById('kpi-critical');
  animateNumber(compEl, before.completionPct, after.completionPct, {format:fmtPct});
  animateNumber(critEl, before.criticalRemaining, after.criticalRemaining, {format:v=>Math.round(v)});
  const dEl = document.getElementById('kpi-completion-d');
  if(dEl) dEl.innerHTML = `↑ ${(after.completionPct-before.completionPct).toFixed(1)}pt vs baseline`;
  animateTopbarStats(before, after);
  renderCriticalList();
}
function onOptimizeFromFieldOps(before, after){
  const completionEl = document.getElementById('fo-completion');
  const utilBefore = (() => { const w=computeAgentWorkloads(before); const c=w.reduce((s,a)=>s+a.capacity,0),a=w.reduce((s,x)=>s+x.assigned,0); return c?Math.round(a/c*100):0; })();
  const utilAfter = (() => { const w=computeAgentWorkloads(after); const c=w.reduce((s,a)=>s+a.capacity,0),a=w.reduce((s,x)=>s+x.assigned,0); return c?Math.round(a/c*100):0; })();
  animateNumber(completionEl, before.completionPct, after.completionPct, {format:fmtPct});
  const travelEl = document.getElementById('fo-travel');
  if(travelEl) travelEl.textContent = routeEfficiencyLabel(after);
  const utilEl = document.getElementById('fo-util');
  animateNumber(utilEl, utilBefore, utilAfter, {format:v=>Math.round(v)+'%'});
  const critEl = document.getElementById('fo-critical');
  animateNumber(critEl, before.criticalRemaining, after.criticalRemaining, {format:v=>Math.round(v)});
  animateTopbarStats(before, after);
  buildAgentWorkloads();
  document.querySelectorAll('#agent-grid .agent-card').forEach(card=>{
    const a = state.agents.find(x=>x.id===card.dataset.openAgent);
    if(!a) return;
    card.querySelector('.util-track i').style.width = Math.min(a.utilPct,100)+'%';
    card.querySelector('.util-track i').classList.toggle('over', a.utilPct>100);
  });
  const deltasEl = document.getElementById('fo-deltas');
  if(deltasEl){ deltasEl.innerHTML = fieldOpsDeltasHtml(); }
}

    document.getElementById('tg-offload').addEventListener('click', function(){ state.simParams.compliantOffload=!state.simParams.compliantOffload; this.classList.toggle('on'); runSimAndUpdate(); });

  }
